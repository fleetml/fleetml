name: fleetml

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "${FLEETML_PG_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: fleetml
      POSTGRES_USER: fleetml
      POSTGRES_PASSWORD: fleetml_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetml"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${FLEETML_MINIO_PORT:-19000}:9000"
      - "${FLEETML_MINIO_CONSOLE_PORT:-19001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - modeldata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/fleetml-models --ignore-existing;
      echo 'Bucket created';
      "

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../internal/db/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://fleetml:fleetml_dev@postgres:5432/fleetml?sslmode=disable", "up"]
    restart: "no"

  nats:
    image: nats:latest
    ports:
      - "${FLEETML_NATS_PORT:-14222}:4222"
      - "${FLEETML_NATS_MONITOR_PORT:-18222}:8222"

  redis:
    image: redis:7-alpine
    ports:
      - "${FLEETML_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  modeldata:

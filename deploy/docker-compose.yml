name: fleetml

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "${FLEETML_PG_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: fleetml
      POSTGRES_USER: fleetml
      POSTGRES_PASSWORD: fleetml_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetml"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3:
    image: chrislusf/seaweedfs:4.48
    # SeaweedFS (Apache-2.0) as the S3-compatible model store. Credentials come from
    # S3_ACCESS_KEY / S3_SECRET_KEY below and must match the server's config.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"fleetml","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","List","Tagging","Write"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY: fleetml
      S3_SECRET_KEY: fleetml-dev-secret
    ports:
      - "${FLEETML_S3_PORT:-19000}:8333"
    volumes:
      - modeldata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../internal/db/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://fleetml:fleetml_dev@postgres:5432/fleetml?sslmode=disable", "up"]
    restart: "no"

  nats:
    image: nats:2.12.1
    # JetStream keeps accepted telemetry until it is in the database.
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - natsdata:/data
    ports:
      - "${FLEETML_NATS_PORT:-14222}:4222"
      - "${FLEETML_NATS_MONITOR_PORT:-18222}:8222"


  # docker compose --profile observability up -d: Prometheus on :19091 scraping
  # the server on the host (:18080), Grafana on :13000 with the FleetML dashboard.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${FLEETML_PROMETHEUS_PORT:-19091}:9090"

  grafana:
    image: grafana/grafana:12.2.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fleetml.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${FLEETML_GRAFANA_PORT:-13000}:3000"

volumes:
  pgdata:
  modeldata:
  natsdata:

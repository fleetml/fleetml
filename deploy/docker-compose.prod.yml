name: fleetml-prod

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: fleetml
      POSTGRES_USER: fleetml
      POSTGRES_PASSWORD: fleetml_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetml"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - modeldata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/fleetml-models --ignore-existing;
      echo 'Bucket created';
      "

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../internal/db/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://fleetml:fleetml_prod@postgres:5432/fleetml?sslmode=disable", "up"]
    restart: "no"

  nats:
    image: nats:latest

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "18080:18080"
      - "19090:19090"
    environment:
      DATABASE_URL: postgres://fleetml:fleetml_prod@postgres:5432/fleetml?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: fleetml-models
      S3_USE_SSL: "false"
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      GRPC_PORT: "19090"
      REST_PORT: "18080"
      LOG_LEVEL: info
      CORS_ORIGINS: "http://localhost:80,http://localhost:3000"
      MIGRATE_ON_START: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
  modeldata:

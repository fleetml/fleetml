name: fleetml-prod

services:
  postgres:
    image: timescale/timescaledb:2.30.2-pg16
    environment:
      POSTGRES_DB: fleetml
      POSTGRES_USER: fleetml
      POSTGRES_PASSWORD: fleetml_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fleetml -d fleetml"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3:
    image: chrislusf/seaweedfs:4.48
    # SeaweedFS (Apache-2.0) as the S3-compatible model store. Credentials come from
    # S3_ACCESS_KEY / S3_SECRET_KEY below and must match the server's config.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"fleetml","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","List","Tagging","Write"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY: fleetml
      S3_SECRET_KEY: change-me-in-production
    ports:
      # Model files go straight between clients and the object store.
      - "${FLEETML_S3_PUBLIC_PORT:-19100}:8333"
    volumes:
      - modeldata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../internal/db/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://fleetml:fleetml_prod@postgres:5432/fleetml?sslmode=disable", "up"]
    restart: "no"

  nats:
    image: nats:2.12.1
    # JetStream keeps accepted telemetry until it is in the database.
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - natsdata:/data


  server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "18080:18080"
      - "19090:19090"
    environment:
      DATABASE_URL: postgres://fleetml:fleetml_prod@postgres:5432/fleetml?sslmode=disable
      S3_ENDPOINT: s3:8333
      # Where clients reach the object store; presigned URLs are signed for it.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost:19100}
      S3_ACCESS_KEY: fleetml
      S3_SECRET_KEY: change-me-in-production
      S3_BUCKET: fleetml-models
      S3_USE_SSL: "false"
      NATS_URL: nats://nats:4222
      # Required, at least 32 characters: export JWT_SECRET=$(openssl rand -base64 32)
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to at least 32 random characters, e.g. export JWT_SECRET=$$(openssl rand -base64 32)}
      # Required, at least 32 characters, different from JWT_SECRET; keep it safe:
      # it encrypts the artifact signing keys. export SIGNING_MASTER_KEY=$(openssl rand -base64 32)
      SIGNING_MASTER_KEY: ${SIGNING_MASTER_KEY:?set SIGNING_MASTER_KEY to at least 32 random characters, e.g. export SIGNING_MASTER_KEY=$$(openssl rand -base64 32)}
      GRPC_PORT: "19090"
      REST_PORT: "18080"
      LOG_LEVEL: info
      CORS_ORIGINS: "http://localhost"
      MIGRATE_ON_START: "true"
      # Optional: if unset, the server generates an admin key on first start and logs it once.
      FLEETML_ADMIN_KEY: ${FLEETML_ADMIN_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      nats:
        condition: service_started

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server

  # docker compose -f deploy/docker-compose.prod.yml --profile observability up -d:
  # Prometheus (internal) and Grafana on :13000 with the FleetML dashboard.
  # Anonymous users can only view; Grafana asks for a new admin password at the
  # first login (admin/admin).
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.2.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fleetml.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "13000:3000"

volumes:
  pgdata:
  modeldata:
  natsdata:

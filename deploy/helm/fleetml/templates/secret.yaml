{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleetml.secretName" . }}
  labels: {{- include "fleetml.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required (at least 32 characters)" .Values.secrets.jwtSecret | quote }}
  SIGNING_MASTER_KEY: {{ required "secrets.signingMasterKey is required (at least 32 characters, keep it)" .Values.secrets.signingMasterKey | quote }}
  FLEETML_ADMIN_KEY: {{ .Values.secrets.adminKey | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ required "secrets.s3SecretKey is required" .Values.secrets.s3SecretKey | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required with the bundled Postgres" .Values.secrets.postgresPassword | quote }}
  {{- end }}
{{- end }}

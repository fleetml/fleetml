apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleetml.fullname" . }}-server
  labels: {{- include "fleetml.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels: {{- include "fleetml.selector" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "fleetml.selector" (dict "root" . "component" "server") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: server
          image: {{ include "fleetml.image" (dict "root" . "image" .Values.server.image) }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - {name: rest, containerPort: 18080}
            - {name: grpc, containerPort: 19090}
          envFrom:
            - secretRef:
                name: {{ include "fleetml.secretName" . }}
          {{- /* The chart's settings, then server.env: a name in both is set once, to server.env's value. */}}
          {{- $env := dict
            "DATABASE_URL" (include "fleetml.databaseURL" .)
            "NATS_URL" (include "fleetml.natsURL" .)
            "S3_ENDPOINT" (include "fleetml.s3Endpoint" .)
            "S3_PUBLIC_ENDPOINT" (required "s3.publicEndpoint is required: the host:port devices download models from" .Values.s3.publicEndpoint)
            "S3_BUCKET" .Values.s3.bucket
            "S3_USE_SSL" .Values.s3.useSSL
            "S3_PUBLIC_USE_SSL" .Values.s3.publicUseSSL
            "REST_PORT" "18080"
            "GRPC_PORT" "19090"
            "MIGRATE_ON_START" "true"
            "DEPENDENCY_TIMEOUT" .Values.server.dependencyTimeout }}
          env:
            {{- range $k, $v := mergeOverwrite $env .Values.server.env }}
            - {name: {{ $k }}, value: {{ $v | toString | quote }}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: rest}
            periodSeconds: 5
          # /livez answers as soon as the process listens, also while it waits
          # (server.dependencyTimeout, 180 s in total) for Postgres, the object
          # store and NATS; /readyz answers once they are all there.
          startupProbe:
            httpGet: {path: /livez, port: rest}
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet: {path: /livez, port: rest}
            periodSeconds: 10
          {{- with .Values.server.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleetml.fullname" . }}-server
  labels: {{- include "fleetml.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  selector: {{- include "fleetml.selector" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - {name: rest, port: {{ .Values.server.service.restPort }}, targetPort: rest}
    - {name: grpc, port: {{ .Values.server.service.grpcPort }}, targetPort: grpc, appProtocol: grpc}

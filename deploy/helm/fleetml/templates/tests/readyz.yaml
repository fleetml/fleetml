apiVersion: v1
kind: Pod
metadata:
  name: {{ include "fleetml.fullname" . }}-test-readyz
  labels: {{- include "fleetml.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: readyz
      image: {{ .Values.tests.image }}
      command: ["wget", "-q", "-O", "-", "http://{{ include "fleetml.fullname" . }}-server:{{ .Values.server.service.restPort }}/readyz"]

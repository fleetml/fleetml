{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fleetml.fullname" . }}-postgres
  labels: {{- include "fleetml.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "fleetml.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "fleetml.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "fleetml.selector" (dict "root" . "component" "postgres") | nindent 8 }}
      # No checksum of the Secret: Postgres reads POSTGRES_PASSWORD only when
      # it creates its volume, so a restart would not apply a new password.
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_DB, value: fleetml}
            - {name: POSTGRES_USER, value: fleetml}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "fleetml.secretName" . }}, key: POSTGRES_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "fleetml", "-d", "fleetml"]
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "fleetml.pvcLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleetml.fullname" . }}-postgres
  labels: {{- include "fleetml.labels" . | nindent 4 }}
spec:
  selector: {{- include "fleetml.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
{{- end }}

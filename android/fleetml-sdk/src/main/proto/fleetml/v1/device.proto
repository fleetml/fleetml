syntax = "proto3";
package fleetml.device.v1;

option go_package = "github.com/fleetml/fleetml/gen/fleetml/v1;fleetmlv1";

service DeviceService {
  // Device registers itself on first boot. A new device must send a valid
  // enrollment_key. A known fingerprint must send either its current token
  // (as "authorization: Bearer <token>" metadata) or an enrollment key for its
  // project; it then gets a new token and the previous one stops working.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Periodic heartbeat — server responds with pending actions
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Exchange a valid token that expires within 7 days for a new one. The old
  // token stops working. Returns FAILED_PRECONDITION if called too early.
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}

message RegisterRequest {
  string fingerprint = 1;
  string os = 2;
  string os_version = 3;
  string chipset = 4;
  uint32 ram_mb = 5;
  bool has_npu = 6;
  bool has_gpu = 7;
  float npu_tflops = 8;
  string agent_version = 9;
  map<string, string> labels = 10;
  // Per-project enrollment key, created via POST /api/v1/projects/{id}/enrollment-keys.
  string enrollment_key = 11;
}

message RegisterResponse {
  string device_id = 1;
  string auth_token = 2;
  DeviceConfig config = 3;
  // Expiry of auth_token, Unix seconds.
  int64 token_expires_at = 4;
}

// The current token is sent as "authorization: Bearer <token>" metadata.
message RefreshTokenRequest {}

message RefreshTokenResponse {
  string auth_token = 1;
  // Expiry of auth_token, Unix seconds.
  int64 token_expires_at = 2;
}

message DeviceConfig {
  uint32 heartbeat_interval_seconds = 1;
  uint32 telemetry_batch_size = 2;
  uint32 max_cache_size_mb = 3;
}

message HeartbeatRequest {
  string device_id = 1;
  repeated ModelStatus loaded_models = 2;
  DeviceHealth health = 3;
}

message ModelStatus {
  string model_id = 1;
  string version = 2;
  string variant_id = 3;
  string status = 4;
}

message DeviceHealth {
  uint32 available_ram_mb = 1;
  float battery_percent = 2;
  float cpu_usage_percent = 3;
  uint64 available_storage_bytes = 4;
}

message HeartbeatResponse {
  repeated ModelAssignment assignments = 1;
  repeated ExperimentAssignment experiments = 2;
  uint32 next_heartbeat_seconds = 3;
}

message ModelAssignment {
  string model_id = 1;
  string model_name = 2;
  string version = 3;
  string variant_id = 4;
  string download_url = 5;
  uint64 blob_size_bytes = 6;
  string blob_sha256 = 7;
  Action action = 8;

  enum Action {
    ACTION_UNSPECIFIED = 0;
    LOAD = 1;
    UPDATE = 2;
    UNLOAD = 3;
  }
}

message ExperimentAssignment {
  string experiment_id = 1;
  string arm_name = 2;
  string model_version_id = 3;
}

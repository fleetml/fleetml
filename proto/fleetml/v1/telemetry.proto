syntax = "proto3";
package fleetml.telemetry.v1;

option go_package = "github.com/fleetml/fleetml/gen/fleetml/v1;fleetmlv1";

service TelemetryService {
  // Batch telemetry upload (efficient for mobile)
  rpc ReportBatch(TelemetryBatch) returns (TelemetryAck);
}

message TelemetryBatch {
  string device_id = 1;
  repeated TelemetryEvent events = 2;
}

message TelemetryEvent {
  string model_version_id = 1;
  string experiment_arm_id = 2;
  EventType type = 3;
  uint32 latency_ms = 4;
  float confidence_score = 5;
  string prediction_label = 6;
  uint32 memory_usage_mb = 7;
  float battery_percent = 8;
  string error_message = 9;
  int64 timestamp_unix_ms = 10;
  // Optional input histograms for feature-level drift: for each configured
  // feature of the model (DeviceConfig.feature_bins), how many of this
  // inference's values fell into each bin.
  repeated FeatureHistogram features = 11;

  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    INFERENCE = 1;
    MODEL_LOAD = 2;
    MODEL_LOAD_FAILED = 3;
    OOM = 4;
    PREDICTION_DRIFT = 5;
    ERROR = 6;
    // A downloaded model's signature did not verify; it was not activated.
    SIGNATURE_INVALID = 7;
  }
}

// Counts per bin for one feature; len(counts) == len(edges) + 1 (values below
// the first edge, between each pair of edges, at or above the last edge).
message FeatureHistogram {
  string name = 1;
  repeated uint32 counts = 2;
}

message TelemetryAck {
  uint32 accepted_count = 1;
  uint32 rejected_count = 2;
}

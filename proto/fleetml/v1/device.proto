syntax = "proto3";
package fleetml.device.v1;

option go_package = "github.com/fleetml/fleetml/gen/fleetml/v1;fleetmlv1";

service DeviceService {
  // Device registers itself on first boot. A new device must send a valid
  // enrollment_key. A known fingerprint must send either its current token
  // (as "authorization: Bearer <token>" metadata) or an enrollment key for its
  // project; it then gets a new token and the previous one stops working.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Periodic heartbeat — server responds with pending actions
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Exchange a valid token that expires within 7 days for a new one. The old
  // token stops working. Returns FAILED_PRECONDITION if called too early.
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}

message RegisterRequest {
  string fingerprint = 1;
  string os = 2;
  string os_version = 3;
  string chipset = 4;
  uint32 ram_mb = 5;
  bool has_npu = 6;
  bool has_gpu = 7;
  float npu_tflops = 8;
  string agent_version = 9;
  map<string, string> labels = 10;
  // Per-project enrollment key, created via POST /api/v1/projects/{id}/enrollment-keys.
  string enrollment_key = 11;
}

message RegisterResponse {
  string device_id = 1;
  string auth_token = 2;
  DeviceConfig config = 3;
  // Expiry of auth_token, Unix seconds.
  int64 token_expires_at = 4;
  // The project's artifact signing keys; replace the stored set with them.
  repeated SigningKey signing_keys = 5;
}

// A public key that signs the project's model artifacts (ed25519).
message SigningKey {
  // Matches ModelAssignment.signing_key_id.
  string key_id = 1;
  // The 32-byte ed25519 public key.
  bytes public_key = 2;
  // For a key being rotated out: Unix seconds after which signatures made
  // with it must be rejected, even offline. 0 for the current key.
  int64 not_after = 3;
}

// The current token is sent as "authorization: Bearer <token>" metadata.
message RefreshTokenRequest {}

message RefreshTokenResponse {
  string auth_token = 1;
  // Expiry of auth_token, Unix seconds.
  int64 token_expires_at = 2;
}

// Settings the device applies; sent at registration and with every heartbeat.
message DeviceConfig {
  // Heartbeat interval while the app is in the foreground.
  uint32 heartbeat_interval_seconds = 1;
  uint32 telemetry_batch_size = 2;
  uint32 max_cache_size_mb = 3;
  uint32 telemetry_flush_interval_seconds = 4;
  // Interval of the background check (one heartbeat and one telemetry flush)
  // while the app is in the background; the OS enforces at least 15 minutes.
  uint32 background_heartbeat_interval_seconds = 5;
  // Which networks non-urgent model downloads may use.
  DownloadPolicy download_policy = 6;
}

// When a device may download a model that is not marked urgent. Urgent
// assignments download on any connected network.
enum DownloadPolicy {
  // The device keeps its own default (UNMETERED_OR_CHARGING in the SDKs).
  DOWNLOAD_POLICY_UNSPECIFIED = 0;
  // An unmetered network (Wi-Fi, Ethernet), or any network while charging.
  UNMETERED_OR_CHARGING = 1;
  // Only an unmetered network.
  UNMETERED_ONLY = 2;
  // Any connected network.
  ANY_NETWORK = 3;
}

message HeartbeatRequest {
  string device_id = 1;
  repeated ModelStatus loaded_models = 2;
  DeviceHealth health = 3;
}

message ModelStatus {
  string model_id = 1;
  string version = 2;
  string variant_id = 3;
  string status = 4;
}

message DeviceHealth {
  uint32 available_ram_mb = 1;
  float battery_percent = 2;
  float cpu_usage_percent = 3;
  uint64 available_storage_bytes = 4;
}

message HeartbeatResponse {
  repeated ModelAssignment assignments = 1;
  repeated ExperimentAssignment experiments = 2;
  uint32 next_heartbeat_seconds = 3;
  // The current device settings; apply them like the ones from Register.
  DeviceConfig config = 4;
  // The project's artifact signing keys; replace the stored set with them.
  repeated SigningKey signing_keys = 5;
}

message ModelAssignment {
  // The model (stable across versions). Report it back in ModelStatus.model_id.
  string model_id = 1;
  string model_name = 2;
  // Human-readable version string, e.g. "1.2.0".
  string version = 3;
  string variant_id = 4;
  string download_url = 5;
  uint64 blob_size_bytes = 6;
  string blob_sha256 = 7;
  Action action = 8;
  // The model version this assignment delivers; use it as model_version_id in telemetry.
  string version_id = 9;
  // Download now on any connected network, ignoring the download policy
  // (set by the deployment, and on rollbacks).
  bool urgent = 10;
  // ed25519 signature by the project key signing_key_id over the UTF-8 bytes
  // "fleetml-artifact-v1\n" + model_id + "\n" + version + "\n" + blob_sha256
  // (lowercase hex). Verify it before activating the model; on failure report
  // SIGNATURE_INVALID and keep the current version.
  bytes signature = 11;
  string signing_key_id = 12;

  enum Action {
    ACTION_UNSPECIFIED = 0;
    LOAD = 1;
    UPDATE = 2;
    UNLOAD = 3;
  }
}

// The device's arm in a running experiment. Tag telemetry for
// model_version_id with experiment_arm_id = arm_id.
message ExperimentAssignment {
  string experiment_id = 1;
  string arm_name = 2;
  string model_version_id = 3;
  string arm_id = 4;
}

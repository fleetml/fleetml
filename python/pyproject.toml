[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fleetml"
dynamic = ["version"]
description = "Python client for FleetML: push models, run and watch rollouts, A/B experiments and drift checks on a FleetML server."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "FleetML Maintainers", email = "fleetml.maintainers@gmail.com" }]
keywords = ["mlops", "edge", "model deployment", "ota", "canary", "a/b testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/fleetml/fleetml"
Documentation = "https://github.com/fleetml/fleetml/blob/main/docs/PYTHON_CLIENT.md"
Repository = "https://github.com/fleetml/fleetml"
Changelog = "https://github.com/fleetml/fleetml/blob/main/CHANGELOG.md"
Issues = "https://github.com/fleetml/fleetml/issues"

[tool.hatch.version]
path = "src/fleetml/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/fleetml", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/fleetml"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Optional[...] and List[...] keep the dataclass annotations evaluable on 3.9.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

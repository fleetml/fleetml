version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - gocritic

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks: []

  exclusions:
    paths:
      - gen
      - vendor

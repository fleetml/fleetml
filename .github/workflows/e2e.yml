name: E2E

# The end-to-end suite against a real server, Postgres/TimescaleDB, NATS and
# SeaweedFS from the dev compose stack. Weekly and on demand.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start the dev stack
        run: |
          make docker-up
          docker compose -f deploy/docker-compose.yml wait migrate
      - name: E2E suite
        run: ./scripts/e2e.sh -v
      - name: Stop the dev stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

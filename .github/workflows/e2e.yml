name: E2E

# The end-to-end suite against a real server, Postgres/TimescaleDB, NATS and
# SeaweedFS from the dev compose stack. Weekly and on demand.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start the dev stack
        run: |
          make docker-up
          ./scripts/wait-migrate.sh
      - name: E2E suite
        run: ./scripts/e2e.sh -v
      - name: Stop the dev stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  helm:
    name: Helm chart on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - name: Install the chart, run helm test and the E2E suite, uninstall
        run: ./scripts/helm-e2e.sh -v

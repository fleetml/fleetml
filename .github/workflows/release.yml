name: Release

# Builds the release binaries (scripts/release-binaries.sh: the CLI for Linux,
# macOS and Windows, the Linux agent, SHA256SUMS) for a tag and attaches them
# to the tag's GitHub release, and pushes the server and dashboard images for
# linux/amd64 and linux/arm64 to ghcr.io (the images job). It runs when a vX.Y.Z tag is pushed, and by hand
# with an existing tag to back-fill a release (docs/RELEASING.md). The release
# notes are written by hand: if the release does not exist yet, the workflow
# creates it as a draft with placeholder notes, and it never edits an existing
# release's notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the binaries to, e.g. v0.10.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  binaries:
    name: Release binaries
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
      # This workflow's own revision for the build script, and the tag's source
      # to build (the same commit when a tag push started the run).
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          path: src
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Build
        run: SRC=src ./scripts/release-binaries.sh "$TAG"
      - name: Attach to the release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "FleetML $TAG" \
              --notes "Draft created by the Release workflow for the binaries. Replace these notes with the CHANGELOG.md section before publishing."
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

  images:
    name: Container images
    runs-on: ubuntu-latest
    # The Helm chart's default images (deploy/helm/fleetml/values.yaml). The
    # packages are private when first pushed; making them public is a manual
    # step in the browser (docs/RELEASING.md).
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - name: Check the tag, and whether it is a pre-release
        id: tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
          version=${TAG#v}
          echo "version=$version" >>"$GITHUB_OUTPUT"
          # A pre-release (v0.5.0-rc.1) gets its version tag only, not latest.
          if [[ "$version" == *-* ]]; then latest=false; else latest=true; fi
          echo "latest=$latest" >>"$GITHUB_OUTPUT"
          echo "Images: $version (latest: $latest)"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          push: true
          tags: |
            ghcr.io/fleetml/fleetml-server:${{ steps.tag.outputs.version }}
            ${{ steps.tag.outputs.latest == 'true' && 'ghcr.io/fleetml/fleetml-server:latest' || '' }}
      - name: Dashboard image
        uses: docker/build-push-action@v7
        with:
          context: dashboard
          file: dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          push: true
          tags: |
            ghcr.io/fleetml/fleetml-dashboard:${{ steps.tag.outputs.version }}
            ${{ steps.tag.outputs.latest == 'true' && 'ghcr.io/fleetml/fleetml-dashboard:latest' || '' }}
      - name: Pushed
        run: |
          for image in fleetml-server fleetml-dashboard; do
            docker buildx imagetools inspect "ghcr.io/fleetml/$image:${{ steps.tag.outputs.version }}"
          done

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: fleetml
          POSTGRES_PASSWORD: fleetml_dev
          POSTGRES_DB: fleetml
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleetml"
          --health-interval 5s --health-timeout 5s --health-retries 20
      nats:
        image: nats:latest
        ports: ["4222:4222"]
    env:
      # Integration tests create and drop their own databases on this server.
      FLEETML_TEST_DATABASE_URL: postgres://fleetml:fleetml_dev@localhost:5432/fleetml?sslmode=disable
      FLEETML_TEST_NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet -tags integration,e2e ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.1
      - name: Test (unit and integration, race detector)
        run: go test -race -count=1 -tags integration -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc
      - name: Build
        run: npm run build

  android:
    name: Android SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :fleetml-sdk:testDebugUnitTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/fleetml-sdk/build/reports/tests/

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_USER: fleetml
          POSTGRES_PASSWORD: fleetml_dev
          POSTGRES_DB: fleetml
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleetml"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Integration tests create and drop their own databases on this server.
      FLEETML_TEST_DATABASE_URL: postgres://fleetml:fleetml_dev@localhost:5432/fleetml?sslmode=disable
      FLEETML_TEST_NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v7
      # A service container cannot be given arguments, and telemetry needs JetStream.
      - name: Start NATS with JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.12.1 --jetstream
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet -tags integration,e2e,clitest ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
      - name: Test (unit and integration, race detector)
        run: go test -race -count=1 -tags integration,clitest -covermode=atomic -coverprofile=coverage.out ./...
      - name: Cross-compile the device agent (linux/amd64, linux/arm64)
        run: make build-agent
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out

  cli-windows:
    name: CLI on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o bin\fleetml.exe .\cmd\fleetml
      - name: fleetml version
        run: .\bin\fleetml.exe version
      - name: fleetml --help
        run: .\bin\fleetml.exe --help
      # Unit tests (httptest only, no integration tag), and the quickstart's CLI
      # calls (project create, push, deploy create and start, device list) run
      # by the Windows binary against a fake of the REST API
      # (internal/cli/clitest); scripts/e2e.sh runs the same test against a
      # real server.
      - name: Unit tests and the CLI smoke test
        run: go test -count=1 ./internal/cli/... ./cmd/fleetml/...

  python:
    name: Python client (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest is 26.04 now, and setup-python has no 3.9 for it.
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      # One command per step: on Windows the shell is PowerShell, where a
      # step fails only on its last command's exit code.
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (ruff)
        run: ruff format --check .
      - name: Type-check (mypy --strict)
        run: mypy
      - name: Unit tests
        run: python -m pytest -q

  python-live:
    name: Python client, live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e "python[dev]"
      - name: Start the dev stack
        run: |
          make docker-up
          ./scripts/wait-migrate.sh
      # The quickstart's sections 1 to 3 in Python against a fresh server.
      - name: Live test
        run: ./scripts/python-e2e.sh
      - name: Stop the dev stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc
      - name: Build
        run: npm run build

  android:
    name: Android SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :fleetml-sdk:testDebugUnitTest :sample-app:testDebugUnitTest
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: android/fleetml-sdk/build/reports/tests/

  # The Android guide's "From Windows" path: the sample app built with
  # gradlew.bat in PowerShell, as a Windows developer runs it.
  android-windows:
    name: Android sample app on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: JDK 17, as From Windows says
        shell: pwsh
        run: |
          Select-String -Path "$env:JAVA_HOME\release" -Pattern JAVA_VERSION
          if (-not (Select-String -Quiet -Path "$env:JAVA_HOME\release" -Pattern 'JAVA_VERSION="17\.')) { throw "JAVA_HOME is not a JDK 17" }
      # The quoting of the guide's gradlew.bat line (not the line itself: this
      # builds with assembleDebug and the key as a -P property, with no phone),
      # a dotted host in quotes (PowerShell cuts an unquoted -Pname=192.168.1.23
      # at the first dot), in PowerShell 7 and in Windows PowerShell 5.1; the
      # generated network config must carry the whole address.
      - name: gradlew.bat assembleDebug (PowerShell 7)
        shell: pwsh
        run: |
          $EK = 'ci-placeholder-key'
          .\gradlew.bat --no-daemon :sample-app:assembleDebug "-PfleetmlEnrollmentKey=$EK" "-PfleetmlDebugHost=192.168.1.23"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Quiet -SimpleMatch '>192.168.1.23<' sample-app\build\generated\res\fleetmlDebugNetworkConfig\xml\network_security_config.xml)) { throw "the dotted host did not reach the build" }
      - name: gradlew.bat assembleDebug (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $EK = 'ci-placeholder-key'
          .\gradlew.bat --no-daemon :sample-app:assembleDebug "-PfleetmlEnrollmentKey=$EK" "-PfleetmlDebugHost=10.20.30.40"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Quiet -SimpleMatch '>10.20.30.40<' sample-app\build\generated\res\fleetmlDebugNetworkConfig\xml\network_security_config.xml)) { throw "the dotted host did not reach the build" }

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build (strict) and check links
        run: make docs-site
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/

  docs-lint:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ports, keys on command lines, versions, CHANGELOG, gh writes, golden blocks
        run: ./scripts/docs-lint.sh

  docs-golden-path:
    name: Docs golden path
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The Get started blocks of these four pages, run as a reader pastes
      # them, against this commit: the release downloads come from a local
      # build of it and `pip install fleetml` from ./python. Device blocks
      # (a phone, a simulator) are run by hand; see docs/RELEASING.md.
      - name: Release binaries of this commit
        run: OUT="$RUNNER_TEMP/dist" ./scripts/release-binaries.sh 0.0.0-ci
      - name: README, QUICKSTART, LINUX_AGENT and PYTHON_CLIENT, block by block
        run: ./scripts/docs-golden-path.sh --local-release "$RUNNER_TEMP/dist" --local-python --timeout 1200 README.md docs/QUICKSTART.md docs/LINUX_AGENT.md docs/PYTHON_CLIENT.md

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    env:
      # Dummy secrets of the length the chart requires (32 characters or more).
      SECRETS: secrets.jwtSecret=0123456789abcdef0123456789abcdef,secrets.signingMasterKey=fedcba9876543210fedcba9876543210,secrets.s3SecretKey=z,secrets.postgresPassword=p
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - name: Lint
        run: |
          helm lint deploy/helm/fleetml --strict --set "$SECRETS,s3.publicEndpoint=models.example.com:443"
      - name: Template (bundled services, and external ones)
        run: |
          helm template t deploy/helm/fleetml -f deploy/helm/fleetml/ci/kind-values.yaml --set "$SECRETS" > /dev/null
          helm template t deploy/helm/fleetml --set "$SECRETS,s3.publicEndpoint=models.example.com:443,s3.publicUseSSL=true" > /dev/null
          # A short secret is refused at install time.
          if helm template t deploy/helm/fleetml --set "$SECRETS,secrets.jwtSecret=short,s3.publicEndpoint=x:1" > /dev/null 2>&1; then
            echo "a 5-character jwtSecret was accepted" >&2; exit 1
          fi
          helm template t deploy/helm/fleetml --set secrets.existingSecret=fleetml,s3.publicEndpoint=s3.example.com:443 \
            --set postgres.enabled=false,postgres.url=postgres://db/fleetml,nats.enabled=false,nats.url=nats://nats:4222 \
            --set seaweedfs.enabled=false,s3.endpoint=s3.example.com:443 > /dev/null
      - name: Rendered values
        run: |
          # The server waits 180 s for its dependencies, inside the startup probe.
          helm template t deploy/helm/fleetml --set "$SECRETS,s3.publicEndpoint=x:1" | grep -q '{name: DEPENDENCY_TIMEOUT, value: "180s"}'
          # A short adminKey is refused (the server would crash-loop on it) ...
          if helm template t deploy/helm/fleetml --set "$SECRETS,secrets.adminKey=short,s3.publicEndpoint=x:1" > /dev/null 2>&1; then
            echo "a 5-character adminKey was accepted" >&2; exit 1
          fi
          # ... unless the keys come from a Secret of your own, which the chart does not read.
          helm template t deploy/helm/fleetml --set secrets.existingSecret=fleetml,secrets.adminKey=short,s3.publicEndpoint=x:1 > /dev/null

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The runner image's shellcheck (0.9 on Ubuntu 24.04), at its default
      # severity; the scripts pass 0.11 as well.
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version | sed -n 2p
          git ls-files -z '*.sh' | xargs -0 shellcheck
      # The workflows, with the shellcheck inside the image for their run: blocks.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
